name: StremioCast iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Cast/**","scripts/**",".github/workflows/ios-unsigned-ipa.yml","README.md"]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout native StremioX source
        uses: actions/checkout@v4
        with:
          repository: TV46/stremiox
          ref: main
          path: upstream
      - name: Resolve latest official Stremio core
        working-directory: upstream
        run: |
          CORE_SHA="$(git ls-remote https://github.com/Stremio/stremio-core.git refs/heads/development | awk '{print $1}')"
          test -n "$CORE_SHA"
          echo "Official Stremio core development revision: $CORE_SHA"
          python3 - "$CORE_SHA" <<'PY'
          from pathlib import Path
          import sys
          p=Path("core/Cargo.toml")
          s=p.read_text()
          old='git = "https://github.com/Stremio/stremio-core", branch = "development"'
          new='git = "https://github.com/Stremio/stremio-core", rev = "'+sys.argv[1]+'"'
          if old not in s:
              if new not in s:
                  raise SystemExit("Could not find the expected official stremio-core dependency")
          else:
              s=s.replace(old,new,1)
              p.write_text(s)
          print("Pinned native build to official stremio-core revision "+sys.argv[1])
          PY
          echo "STREMIO_CORE_SHA=$CORE_SHA" >> "$GITHUB_ENV"
      - name: Apply Cast patch
        run: |
          cp -R Cast upstream/app/
          cp scripts/apply-cast-overlay.sh upstream/
          bash upstream/apply-cast-overlay.sh upstream/app
      - name: Select Xcode and install build toolchains
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          brew install xcodegen
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup +nightly target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Fetch upstream runtime resources
        run: |
          bash upstream/scripts/fetch-server-deps.sh
          bash upstream/app/scripts/fetch-node-macos.sh
      - name: Verify build toolchains
        run: |
          rustup show
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
          echo "Building against official stremio-core $STREMIO_CORE_SHA"
      - name: Patch upstream core Env compatibility
        run: python3 scripts/patch-core-client-info.py
      - name: Build StremioX core XCFramework
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("upstream/scripts/build-core-xcframework.sh")
          lines=p.read_text().splitlines()
          p.write_text("\n".join(line for line in lines if not line.strip().startswith('source "$HOME/.cargo/env"'))+"\n")
          PY
          bash -x upstream/scripts/build-core-xcframework.sh
      - name: Generate Xcode project
        working-directory: upstream/app
        run: xcodegen generate
      - name: Resolve packages
        working-directory: upstream/app
        run: xcodebuild -resolvePackageDependencies -project StremioX.xcodeproj -scheme StremioXiOSNative
      - name: Build unsigned app
        working-directory: upstream/app
        run: |
          xcodebuild -project StremioX.xcodeproj -scheme StremioXiOSNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/StremioXiOSNative.app"
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr StremioCast-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: StremioCast-unsigned-IPA
          path: StremioCast-iOS-unsigned.ipa
          retention-days: 14
