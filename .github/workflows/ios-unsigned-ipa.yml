name: StremioCast iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Cast/**","scripts/**",".github/workflows/ios-unsigned-ipa.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout StremioX upstream
        uses: actions/checkout@v4
        with:
          repository: TV46/stremiox
          ref: main
          path: upstream
      - name: Apply Cast patch
        run: |
          cp -R Cast upstream/app/
          cp scripts/apply-cast-overlay.sh upstream/
          bash upstream/apply-cast-overlay.sh upstream/app
      - name: Install XcodeGen and Rust
        run: |
          brew install xcodegen
          rustup toolchain install nightly --component rust-src
          rustup default stable
      - name: Fetch upstream runtime resources
        run: |
          bash upstream/scripts/fetch-server-deps.sh
          bash upstream/app/scripts/fetch-node-macos.sh
      - name: Diagnose Rust and Apple SDKs
        run: |
          echo "Working directory: $(pwd)"
          echo "Core directory:"
          ls -ld upstream/core upstream/scripts || true
          echo "Rust tools:"
          command -v rustup || true
          command -v cargo || true
          rustup show || true
          echo "Apple SDK availability:"
          for sdk in appletvos appletvsimulator iphoneos iphonesimulator; do
            echo "--- $sdk ---"
            xcrun --sdk "$sdk" --show-sdk-path || true
          done
      - name: Build StremioX core XCFramework
        run: bash -x upstream/scripts/build-core-xcframework.sh
      - name: Generate Xcode project
        working-directory: upstream/app
        run: xcodegen generate
      - name: Resolve packages
        working-directory: upstream/app
        run: xcodebuild -resolvePackageDependencies -project StremioX.xcodeproj -scheme StremioXiOSNative
      - name: Build unsigned app
        working-directory: upstream/app
        run: |
          xcodebuild -project StremioX.xcodeproj -scheme StremioXiOSNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/StremioX.app"
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr StremioCast-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: StremioCast-unsigned-IPA
          path: StremioCast-iOS-unsigned.ipa
          retention-days: 14
